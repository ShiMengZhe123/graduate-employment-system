<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理员控制台 - 轻大就业平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .stat-card { border-left: 4px solid; transition:0.2s;}
        .stat-card:hover { transform: translateY(-2px);}
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <span class="navbar-brand"><i class="fas fa-crown"></i> 管理员控制台</span>
        <div>
            <a href="/admin/manage-recruitments" class="btn btn-sm btn-outline-light me-2">📋 招聘审核</a>
            <a href="/logout" class="btn btn-sm btn-light">退出</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <!-- 统计卡片区域（扩展） -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card stat-card border-0 shadow-sm" style="border-left-color: #0d6efd;">
                <div class="card-body"><i class="fas fa-user-graduate fa-2x float-end text-primary"></i>
                    <h6>学生总数</h6>
                    <h2 th:text="${studentCount}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card border-0 shadow-sm" style="border-left-color: #198754;">
                <div class="card-body"><i class="fas fa-building fa-2x float-end text-success"></i>
                    <h6>企业注册数</h6>
                    <h2 th:text="${companyCount}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card border-0 shadow-sm" style="border-left-color: #ffc107;">
                <div class="card-body"><i class="fas fa-bullhorn fa-2x float-end text-warning"></i>
                    <h6>在招岗位</h6>
                    <h2 th:text="${jobCount}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card border-0 shadow-sm" style="border-left-color: #6f42c1;">
                <div class="card-body"><i class="fas fa-newspaper fa-2x float-end text-info"></i>
                    <h6>新闻公告</h6>
                    <h2 th:text="${#lists.size(newsList)}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- 图表 + 发布新闻 -->
    <div class="row">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header"><i class="fas fa-chart-bar"></i> 各专业结业率（模拟）</div>
                <div class="card-body"><canvas id="gradChart" width="400" height="200"></canvas></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header"><i class="fas fa-plus-circle"></i> 发布新公告</div>
                <div class="card-body">
                    <form method="post" action="/admin/add-news">
                        <input type="text" name="title" class="form-control mb-2" placeholder="标题" required>
                        <textarea name="content" class="form-control mb-2" rows="2" placeholder="内容"></textarea>
                        <button class="btn btn-primary w-100">发布</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 用户管理（简表） + 公告管理 -->
    <div class="row mt-4">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-secondary text-white"><i class="fas fa-users"></i> 用户管理（最近学生）</div>
                <div class="card-body p-0">
                    <table class="table table-sm mb-0">
                        <thead><tr><th>姓名</th><th>学号</th><th>专业</th><th>状态</th></tr></thead>
                        <tbody>
                        <tr th:each="stu : ${studentsSample}">
                            <td th:text="${stu.name}">张三</td>
                            <td th:text="${stu.studentId}">202101234</td>
                            <td th:text="${stu.major}">计算机</td>
                            <td><span class="badge bg-success">正常</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer"><a href="#">查看全部学生</a> | <a href="#">企业审核</a></div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header bg-warning"><i class="fas fa-list"></i> 公告管理</div>
                <div class="card-body p-0">
                    <table class="table table-bordered mb-0">
                        <thead><tr><th>ID</th><th>标题</th><th>发布日期</th><th>操作</th></tr></thead>
                        <tbody>
                        <tr th:each="news, iterStat : ${newsList}">
                            <td th:text="${iterStat.index + 1}"></td>
                            <td th:text="${news.title}"></td>
                            <td th:text="${news.publishDate}"></td>
                            <td>
                                <form method="post" th:action="@{/admin/delete-news/{index}(index=${iterStat.index})}">
                                    <button class="btn btn-sm btn-danger">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 系统状态与备份 -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="card bg-light">
                <div class="card-body text-center">
                    <i class="fas fa-database"></i> 数据备份时间：2026-05-25 20:00 |
                    <i class="fas fa-chart-line"></i> 平台访问量本周 +12% |
                    <i class="fas fa-cog"></i> <a href="#">系统设置</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('gradChart').getContext('2d');
    const majorRate = /*[[${majorRate}]]*/ {};
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: Object.keys(majorRate),
            datasets: [{ label: '结业率 (%)', data: Object.values(majorRate), backgroundColor: '#36a2eb' }]
        }
    });
</script>
</body>
</html>
