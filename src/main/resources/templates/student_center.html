<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生中心 - 毕业生就业服务平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; background: #f0f2f5; height: 100vh; overflow: hidden; }
    .app { display: flex; height: 100vh; width: 100%; }
    .sidebar { width: 280px; background: linear-gradient(180deg, #1e2a3a 0%, #0f1724 100%); color: #e2e8f0; display: flex; flex-direction: column; box-shadow: 4px 0 20px rgba(0,0,0,0.08); transition: width 0.3s; z-index: 10; }
    .sidebar-header { padding: 28px 20px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
    .sidebar-header h2 { font-size: 1.4rem; font-weight: 600; color: white; display: flex; align-items: center; gap: 10px; }
    .sidebar-header h2::before { content: "🎓"; font-size: 1.6rem; }
    .nav-menu { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
    .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 12px; cursor: pointer; transition: all 0.2s; color: #cbd5e1; font-size: 1rem; font-weight: 500; }
    .nav-item i { font-style: normal; font-size: 1.3rem; width: 28px; text-align: center; }
    .nav-item:hover { background: #2d3a4b; color: white; }
    .nav-item.active { background: #3b82f6; color: white; box-shadow: 0 6px 12px rgba(59,130,246,0.25); }
    .logout-area { padding: 24px 20px 30px; border-top: 1px solid #334155; margin-top: auto; }
    .logout-btn { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(239,68,68,0.2); border-radius: 40px; color: #f87171; text-decoration: none; transition: 0.2s; font-weight: 500; }
    .logout-btn:hover { background: #ef4444; color: white; }
    .main-content { flex: 1; overflow-y: auto; padding: 24px 32px; background: #f8fafc; }
    .content-card { background: white; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); padding: 28px 32px; transition: all 0.2s; max-width: 1100px; margin: 0 auto; }
    .card-title { font-size: 1.8rem; font-weight: 600; color: #0f172a; border-left: 5px solid #3b82f6; padding-left: 18px; margin-bottom: 24px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; margin-bottom: 32px; }
    .info-item { background: #f8fafc; padding: 14px 18px; border-radius: 16px; display: flex; align-items: baseline; gap: 12px; }
    .info-label { font-weight: 600; color: #475569; min-width: 80px; }
    .info-value { color: #1e293b; font-weight: 500; }
    .grades-table { width: 100%; border-collapse: collapse; margin: 20px 0; background: #fefefe; border-radius: 16px; overflow: hidden; }
    .grades-table th, .grades-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    .grades-table th { background: #f1f5f9; font-weight: 600; color: #0f172a; }
    .honor-list { list-style: none; margin-top: 10px; }
    .honor-list li { background: #f1f5f9; margin: 8px 0; padding: 8px 16px; border-radius: 40px; display: inline-block; margin-right: 12px; font-size: 0.9rem; }
    .resume-form textarea, .resume-form input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 12px; margin-bottom: 16px; font-family: inherit; }
    .delivery-table, .job-table { width: 100%; border-collapse: collapse; }
    .delivery-table th, .delivery-table td, .job-table th, .job-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 40px; font-size: 0.8rem; }
    .badge-secondary { background: #64748b; color: white; }
    .badge-info { background: #0ea5e9; color: white; }
    .badge-success { background: #10b981; color: white; }
    .badge-danger { background: #ef4444; color: white; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 40px; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 20px; }
    button:hover { background: #2563eb; transform: translateY(-1px); }
    button:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .quiz-question { margin-bottom: 28px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
    .quiz-question p { font-weight: 600; margin-bottom: 12px; color: #1e293b; }
    .quiz-options { display: flex; flex-wrap: wrap; gap: 24px; }
    .quiz-options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .report-box { margin-top: 24px; background: #eef2ff; padding: 20px; border-radius: 20px; display: none; }
    .tips-card, .exp-card { background: #f9fafb; border-radius: 20px; padding: 20px; margin-bottom: 20px; border-left: 4px solid #3b82f6; }
    .job-detail-btn { background: none; border: none; color: #3b82f6; cursor: pointer; margin-left: 10px; font-size: 0.8rem; }
    @media (max-width: 768px) { .sidebar { width: 80px; } .sidebar-header h2 span, .nav-item span:last-child, .logout-btn span { display: none; } .nav-item { justify-content: center; padding: 12px; } .main-content { padding: 16px; } }
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header"><h2><span>毕业就业平台</span></h2></div>
    <div class="nav-menu">
      <div class="nav-item" data-tab="profile"><i>👤</i> <span>个人中心</span></div>
      <div class="nav-item" data-tab="resume"><i>📄</i> <span>我的简历</span></div>
      <div class="nav-item" data-tab="jobs"><i>📢</i> <span>招聘信息</span></div>
      <div class="nav-item" data-tab="deliveries"><i>📬</i> <span>投递记录</span></div>
      <div class="nav-item" data-tab="quiz"><i>📊</i> <span>职业测试</span></div>
      <div class="nav-item" data-tab="tips"><i>💡</i> <span>求职技巧</span></div>
      <div class="nav-item" data-tab="experience"><i>🎤</i> <span>面试经验</span></div>
    </div>
    <div class="logout-area"><a href="/logout" class="logout-btn"><i>🚪</i> <span>注销登录</span></a></div>
  </div>
  <div class="main-content" id="mainContent"><div id="dynamicContent"></div></div>
</div>

<script>
  let currentStudent = null;
  let currentTab = 'profile';
  let allJobs = [];           // 存储当前显示的招聘列表
  let deliveredJobIds = new Set(); // 已投递岗位ID集合

  // 通用 fetch 封装
  async function fetchJSON(url, options = {}) {
    const res = await fetch(url, options);
    if (res.status === 401) { window.location.href = '/'; return null; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }

  // 加载个人信息
  async function loadStudentProfile() {
    try {
      currentStudent = await fetchJSON('/student/api/profile');
    } catch(e) { console.error(e); alert('加载个人信息失败'); }
  }

  // 渲染个人中心
  function renderProfile() {
    if (!currentStudent) return '<div class="content-card">加载中...</div>';
    const s = currentStudent;
    const gradesRows = s.grades ? Object.entries(s.grades).map(([c,score]) => `<tr><td>${escapeHtml(c)}</td><td>${score}</td></tr>`).join('') : '<tr><td colspan="2">暂无成绩</td></tr>';
    const honorsHtml = s.honors?.map(h => `<li>🏆 ${escapeHtml(h.title)} (${h.year})</li>`).join('') || '<li>暂无荣誉记录</li>';
    return `
            <div class="content-card">
                <div class="card-title">👤 个人中心</div>
                <div class="info-grid">
                    <div class="info-item"><span class="info-label">学号：</span><span class="info-value">${escapeHtml(s.studentId)}</span></div>
                    <div class="info-item"><span class="info-label">姓名：</span><span class="info-value">${escapeHtml(s.name)}</span></div>
                    <div class="info-item"><span class="info-label">专业：</span><span class="info-value">${escapeHtml(s.major)}</span></div>
                    <div class="info-item"><span class="info-label">班级：</span><span class="info-value">${escapeHtml(s.className)}</span></div>
                    <div class="info-item"><span class="info-label">手机号：</span><span class="info-value">${escapeHtml(s.phone)}</span></div>
                    <div class="info-item"><span class="info-label">已修学分：</span><span class="info-value">${s.earnedCredits || 0}</span></div>
                </div>
                <h3>📚 在校成绩</h3><table class="grades-table"><thead><tr><th>课程</th><th>分数</th></tr></thead><tbody>${gradesRows}</tbody></table>
                <h3>🏅 荣誉奖项</h3><div class="honor-list">${honorsHtml}</div>
            </div>
        `;
  }

  // ---------- 简历相关 ----------
  let currentResume = null;
  async function loadResume() {
    try {
      currentResume = await fetchJSON('/student/api/resume');
    } catch(e) { currentResume = null; }
    renderResumeForm();
  }
  function renderResumeForm() {
    const r = currentResume || { education:'', skills:'', experience:'', selfEvaluation:'', phone: currentStudent?.phone || '', email:'' };
    document.getElementById('dynamicContent').innerHTML = `
            <div class="content-card">
                <div class="card-title">📄 我的简历</div>
                <form id="resumeForm" class="resume-form">
                    <label>教育背景</label><textarea id="education" rows="3">${escapeHtml(r.education)}</textarea>
                    <label>技能特长</label><textarea id="skills" rows="3">${escapeHtml(r.skills)}</textarea>
                    <label>实习/项目经验</label><textarea id="experience" rows="4">${escapeHtml(r.experience)}</textarea>
                    <label>自我评价</label><textarea id="selfEvaluation" rows="3">${escapeHtml(r.selfEvaluation)}</textarea>
                    <label>联系电话</label><input type="text" id="phone" value="${escapeHtml(r.phone)}">
                    <label>邮箱</label><input type="email" id="email" value="${escapeHtml(r.email)}">
                    <button type="button" id="saveResumeBtn">保存简历</button>
                </form>
                <div id="resumeMsg"></div>
            </div>
        `;
    document.getElementById('saveResumeBtn').onclick = saveResume;
  }
  async function saveResume() {
    const data = {
      education: document.getElementById('education').value,
      skills: document.getElementById('skills').value,
      experience: document.getElementById('experience').value,
      selfEvaluation: document.getElementById('selfEvaluation').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value
    };
    try {
      const res = await fetch('/student/api/resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      const msgDiv = document.getElementById('resumeMsg');
      if (result.status === 'success') {
        msgDiv.innerHTML = '<span style="color:green;">✅ 简历保存成功！</span>';
        loadResume();
      } else {
        msgDiv.innerHTML = '<span style="color:red;">❌ 保存失败</span>';
      }
    } catch(e) { alert('保存失败'); }
  }

  // ---------- 招聘信息板块 ----------
  async function loadJobs() {
    try {
      allJobs = await fetchJSON('/student/api/recruitments');
      // 同时获取已投递记录，用于判断按钮状态
      const deliveries = await fetchJSON('/student/api/deliveries');
      deliveredJobIds.clear();
      deliveries.forEach(d => deliveredJobIds.add(d.recruitmentId));
      renderJobs();
    } catch(e) { console.error(e); allJobs = []; renderJobs(); }
  }
  function renderJobs() {
    if (!allJobs.length) {
      document.getElementById('dynamicContent').innerHTML = `<div class="content-card"><div class="card-title">📢 招聘信息</div><p>暂无招聘岗位，请稍后再来。</p></div>`;
      return;
    }
    let html = `<div class="content-card"><div class="card-title">📢 招聘信息</div><table class="job-table"><thead><tr><th>公司</th><th>岗位</th><th>发布日期</th><th>操作</th></tr></thead><tbody>`;
    for (let job of allJobs) {
      const isDelivered = deliveredJobIds.has(job.id);
      html += `<tr>
                        <td>${escapeHtml(job.companyName)}</td>
                        <td>${escapeHtml(job.jobTitle)}<button class="job-detail-btn" data-id="${job.id}">详情</button></td>
                        <td>${job.publishDate}</td>
                        <td>${isDelivered ? '<span class="badge badge-secondary">已投递</span>' : `<button class="deliver-btn" data-id="${job.id}">投递简历</button>`}</td>
                     </tr>`;
    }
    html += `</tbody></table></div>`;
    document.getElementById('dynamicContent').innerHTML = html;
    // 绑定详情按钮事件（弹窗显示详细要求）
    document.querySelectorAll('.job-detail-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const jobId = parseInt(btn.dataset.id);
        const job = allJobs.find(j => j.id === jobId);
        if (job) {
          alert(`【${job.jobTitle}】\n公司：${job.companyName}\n发布日期：${job.publishDate}\n岗位详情：\n${job.details}`);
        }
      });
    });
    // 绑定投递按钮事件
    document.querySelectorAll('.deliver-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const jobId = parseInt(btn.dataset.id);
        await deliverResume(jobId);
        await loadJobs(); // 刷新列表
      });
    });
  }
  async function deliverResume(recruitmentId) {
    try {
      const res = await fetch(`/student/api/deliver?recruitmentId=${recruitmentId}`, { method: 'POST' });
      const result = await res.json();
      if (result.status === 'success') {
        alert('投递成功！');
      } else {
        alert(result.message || '投递失败');
      }
    } catch(e) {
      alert('网络错误，请重试');
    }
  }

  // ---------- 投递记录 ----------
  let deliveries = [];
  async function loadDeliveries() {
    try {
      deliveries = await fetchJSON('/student/api/deliveries');
    } catch(e) { deliveries = []; }
    renderDeliveries();
  }
  function renderDeliveries() {
    if (!deliveries.length) {
      document.getElementById('dynamicContent').innerHTML = `<div class="content-card"><div class="card-title">📬 投递记录</div><p>暂无投递记录</p></div>`;
      return;
    }
    let rows = '';
    for (let d of deliveries) {
      let badge = '';
      if (d.status === '已投递') badge = '<span class="badge badge-secondary">已投递</span>';
      else if (d.status === '已查看') badge = '<span class="badge badge-info">已查看</span>';
      else if (d.status === '已邀请面试') badge = '<span class="badge badge-success">已邀请面试</span>';
      else badge = '<span class="badge badge-danger">不合适</span>';
      rows += `<tr><td>${escapeHtml(d.companyName)}</td><td>${escapeHtml(d.jobTitle)}</td><td>${d.deliveryDate}</td><td>${badge}</td></tr>`;
    }
    document.getElementById('dynamicContent').innerHTML = `
            <div class="content-card">
                <div class="card-title">📬 投递记录</div>
                <table class="delivery-table"><thead><tr><th>公司</th><th>岗位</th><th>投递日期</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>
            </div>
        `;
  }

  // ---------- 职业测试 ----------
  const quizQuestions = [
    { text: "1. 你更喜欢哪种工作环境？", options: ["安静的独立办公室", "团队协作的开放空间", "充满活力的创意工作室", "经常出差的外部环境"] },
    { text: "2. 你更擅长以下哪项活动？", options: ["数据分析与研究", "艺术创作与设计", "与人沟通交流", "组织与管理项目"] },
    { text: "3. 你认为自己最重要的品质是？", options: ["逻辑严谨", "富有创意", "善解人意", "目标导向"] },
    { text: "4. 你在业余时间最喜欢做什么？", options: ["阅读科技文章", "绘画/音乐", "参加社交活动", "策划小型项目"] },
    { text: "5. 你期望的工作节奏是？", options: ["稳定规律", "灵活自由", "快速变化", "高强度高回报"] },
    { text: "6. 你更看重工作的哪个方面？", options: ["技术成长", "发挥创造力", "帮助他人", "领导权力"] },
    { text: "7. 你如何处理复杂问题？", options: ["系统分析数据", "头脑风暴新方案", "咨询他人意见", "快速决策执行"] },
    { text: "8. 你喜欢的领导风格是？", options: ["专业指导型", "鼓励创新型", "民主参与型", "结果导向型"] },
    { text: "9. 你更愿意在哪种公司工作？", options: ["大型科技公司", "创意广告公司", "教育/咨询机构", "创业公司"] },
    { text: "10. 十年后你希望成为？", options: ["技术专家", "艺术家/设计师", "教育者/顾问", "企业管理者"] }
  ];
  function renderQuiz() {
    let html = `<div class="content-card"><div class="card-title">📊 职业测试问卷</div><form id="quizForm"><div id="questionsContainer"></div><button type="button" id="submitQuizBtn">提交并生成报告</button></form><div id="reportResult" class="report-box"></div></div>`;
    setTimeout(() => {
      const container = document.getElementById('questionsContainer');
      if (container) {
        container.innerHTML = quizQuestions.map((q, idx) => `
                    <div class="quiz-question"><p>${q.text}</p><div class="quiz-options">${q.options.map((opt, optIdx) => `<label><input type="radio" name="q${idx}" value="${optIdx}" required> ${opt}</label>`).join('')}</div></div>
                `).join('');
      }
      const btn = document.getElementById('submitQuizBtn');
      if (btn) btn.onclick = submitQuiz;
    }, 0);
    return html;
  }
  async function submitQuiz() {
    const answers = [];
    for (let i = 0; i < quizQuestions.length; i++) {
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      if (!selected) { alert(`请完成第 ${i+1} 题`); return; }
      answers.push(parseInt(selected.value));
    }
    try {
      const res = await fetch('/student/api/quiz/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers }) });
      if (!res.ok) throw new Error();
      const data = await res.json();
      const reportDiv = document.getElementById('reportResult');
      reportDiv.style.display = 'block';
      reportDiv.innerHTML = `<h3>📈 你的测评报告</h3><p><strong>类型：</strong> ${data.type}</p><p><strong>得分：</strong> ${data.score}</p><p><strong>职业规划建议：</strong> ${data.suggestion}</p>`;
    } catch(e) { alert('提交失败'); }
  }

  // 求职技巧 & 面试经验
  function renderTips() {
    const tips = [
      { title: "📌 简历优化技巧", content: "使用STAR法则描述经历；针对岗位定制简历；突出量化成果。" },
      { title: "📌 求职渠道拓展", content: "关注企业官网、宣讲会、内推；建立领英档案。" },
      { title: "📌 面试前准备", content: "研究公司背景；准备常见问题；准备反问问题。" },
      { title: "📌 薪资谈判技巧", content: "了解行业薪资范围；不主动透露期望；强调价值。" }
    ];
    return `<div class="content-card"><div class="card-title">💡 求职技巧</div>${tips.map(t => `<div class="tips-card"><h3>${t.title}</h3><p>${t.content}</p></div>`).join('')}</div>`;
  }
  function renderExperience() {
    const exps = [
      { title: "🎯 腾讯产品经理面试", content: "群面设计社交App，主动计时引导；二面深挖实习，用KANO模型回答优先级问题。" },
      { title: "🎯 华为技术面", content: "考察Java基础、多线程、JVM；手写单例和生产者消费者。" },
      { title: "🎯 字节跳动实习面试", content: "一面项目细节，二面算法题，三面HR谈规划。" }
    ];
    return `<div class="content-card"><div class="card-title">🎤 面试经验</div>${exps.map(e => `<div class="exp-card"><h3>${e.title}</h3><p>${e.content}</p></div>`).join('')}</div>`;
  }

  // 路由切换
  async function switchTab(tabId) {
    currentTab = tabId;
    document.querySelectorAll('.nav-item').forEach(item => {
      if (item.dataset.tab === tabId) item.classList.add('active');
      else item.classList.remove('active');
    });
    const contentDiv = document.getElementById('dynamicContent');
    if (tabId === 'profile') {
      if (!currentStudent) await loadStudentProfile();
      contentDiv.innerHTML = renderProfile();
    } else if (tabId === 'resume') {
      if (!currentStudent) await loadStudentProfile();
      await loadResume();
    } else if (tabId === 'jobs') {
      await loadJobs();
    } else if (tabId === 'deliveries') {
      await loadDeliveries();
    } else if (tabId === 'quiz') {
      contentDiv.innerHTML = renderQuiz();
    } else if (tabId === 'tips') {
      contentDiv.innerHTML = renderTips();
    } else if (tabId === 'experience') {
      contentDiv.innerHTML = renderExperience();
    }
  }

  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  window.addEventListener('DOMContentLoaded', async () => {
    await loadStudentProfile();
    if (!currentStudent) return;
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    switchTab('profile');
  });
</script>
</body>
</html>
