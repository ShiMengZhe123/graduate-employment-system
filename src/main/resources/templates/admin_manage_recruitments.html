<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>招聘审核 - 管理员</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-danger">
  <div class="container">
    <span class="navbar-brand">🔐 招聘信息审核</span>
    <a href="/admin/dashboard" class="btn btn-sm btn-light">返回控制台</a>
  </div>
</nav>
<div class="container mt-4">
  <!-- 待审核招聘 -->
  <h4>待审核招聘</h4>
  <table class="table table-bordered">
    <thead class="table-warning">
    <tr><th>ID</th><th>岗位名称</th><th>公司</th><th>发布日期</th><th>操作</th></tr>
    </thead>
    <tbody>
    <tr th:each="r : ${recruitments}" th:if="${r.status == 'pending'}">
      <td th:text="${r.id}"></td>
      <td th:text="${r.jobTitle}"></td>
      <td th:text="${r.companyName}"></td>
      <td th:text="${r.publishDate}"></td>
      <td>
        <form method="post" th:action="@{/admin/review-recruitment/{id}(id=${r.id})}" style="display:inline-block;">
          <input type="hidden" name="action" value="approve">
          <button class="btn btn-sm btn-success">通过</button>
        </form>
        <form method="post" th:action="@{/admin/review-recruitment/{id}(id=${r.id})}" style="display:inline-block;">
          <input type="hidden" name="action" value="reject">
          <button class="btn btn-sm btn-danger">拒绝</button>
        </form>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(recruitments)}">
      <td colspan="5" class="text-center">暂无招聘信息</td>
    </tr>
    <tr th:if="${!#lists.isEmpty(recruitments) and #lists.size(recruitments.![status == 'pending']) == 0}">
      <td colspan="5" class="text-center">暂无待审核招聘</td>
    </tr>
    </tbody>
  </table>

  <!-- 已通过招聘 -->
  <h4 class="mt-4">已通过招聘</h4>
  <table class="table table-bordered">
    <thead class="table-success">
    <tr><th>ID</th><th>岗位名称</th><th>公司</th><th>发布日期</th><th>状态</th></tr>
    </thead>
    <tbody>
    <tr th:each="r : ${recruitments}" th:if="${r.status == 'approved'}">
      <td th:text="${r.id}"></td>
      <td th:text="${r.jobTitle}"></td>
      <td th:text="${r.companyName}"></td>
      <td th:text="${r.publishDate}"></td>
      <td><span class="badge bg-success">已通过</span></td>
    </tr>
    <tr th:if="${#lists.isEmpty(recruitments)}">
      <td colspan="5" class="text-center">暂无招聘信息</td>
    </tr>
    <tr th:if="${!#lists.isEmpty(recruitments) and #lists.size(recruitments.![status == 'approved']) == 0}">
      <td colspan="5" class="text-center">暂无已通过招聘</td>
    </tr>
    </tbody>
  </table>

  <!-- 已拒绝招聘（可选） -->
  <h4 class="mt-4">已拒绝招聘</h4>
  <table class="table table-bordered">
    <thead class="table-danger">
    <tr><th>ID</th><th>岗位名称</th><th>公司</th><th>发布日期</th><th>状态</th></tr>
    </thead>
    <tbody>
    <tr th:each="r : ${recruitments}" th:if="${r.status == 'rejected'}">
      <td th:text="${r.id}"></td>
      <td th:text="${r.jobTitle}"></td>
      <td th:text="${r.companyName}"></td>
      <td th:text="${r.publishDate}"></td>
      <td><span class="badge bg-danger">已拒绝</span></td>
    </tr>
    <tr th:if="${#lists.isEmpty(recruitments)}">
      <td colspan="5" class="text-center">暂无招聘信息</td>
    </tr>
    <tr th:if="${!#lists.isEmpty(recruitments) and #lists.size(recruitments.![status == 'rejected']) == 0}">
      <td colspan="5" class="text-center">暂无已拒绝招聘</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
