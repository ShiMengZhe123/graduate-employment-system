<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>注册 - 轻大就业服务平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .register-container { max-width: 600px; margin: 50px auto; }
    .card { border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .role-selector { display: flex; gap: 15px; margin-bottom: 20px; }
    .role-btn { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 40px; background: #e9ecef; transition: 0.2s; }
    .role-btn.active { background: #0d6efd; color: white; }
    .role-form { display: none; }
    .role-form.active-form { display: block; }
  </style>
</head>
<body>
<div class="container register-container">
  <div class="card">
    <div class="card-header bg-primary text-white text-center">
      <h4>📝 用户注册</h4>
    </div>
    <div class="card-body">
      <!-- 角色切换按钮 -->
      <div class="role-selector">
        <div class="role-btn" data-role="student">👨‍🎓 学生注册</div>
        <div class="role-btn" data-role="company">🏢 企业注册</div>
        <div class="role-btn" data-role="admin">🔐 管理员注册</div>
      </div>

      <!-- 学生注册表单 -->
      <div id="studentForm" class="role-form">
        <form method="post" action="/register/student">
          <div class="mb-3">
            <label>学号 *</label>
            <input type="text" name="studentId" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>姓名 *</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>专业</label>
            <input type="text" name="major" class="form-control">
          </div>
          <div class="mb-3">
            <label>班级</label>
            <input type="text" name="className" class="form-control">
          </div>
          <div class="mb-3">
            <label>手机号</label>
            <input type="tel" name="phone" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary w-100">注册</button>
        </form>
      </div>

      <!-- 企业注册表单 -->
      <div id="companyForm" class="role-form">
        <form method="post" action="/register/company">
          <div class="mb-3">
            <label>统一社会信用代码 *</label>
            <input type="text" name="creditCode" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>企业名称 *</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>联系人电话 *</label>
            <input type="tel" name="contactPhone" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>企业地址</label>
            <input type="text" name="address" class="form-control">
          </div>
          <div class="mb-3">
            <label>企业简介</label>
            <textarea name="description" class="form-control" rows="2"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">注册</button>
        </form>
      </div>

      <!-- 管理员注册表单（可根据需要隐藏或加权限） -->
      <div id="adminForm" class="role-form">
        <form method="post" action="/register/admin">
          <div class="mb-3">
            <label>用户名 *</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>密码 *</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>角色标识（如：超级管理员）</label>
            <input type="text" name="role" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary w-100">注册</button>
        </form>
      </div>

      <hr>
      <div class="text-center">
        已有账号？<a href="/">去登录</a>
      </div>
    </div>
  </div>
</div>

<script>
  // 角色切换JS
  const roleBtns = document.querySelectorAll('.role-btn');
  const forms = {
    student: document.getElementById('studentForm'),
    company: document.getElementById('companyForm'),
    admin: document.getElementById('adminForm')
  };
  roleBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const role = btn.dataset.role;
      // 高亮按钮
      roleBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // 显示对应表单
      Object.keys(forms).forEach(key => {
        forms[key].classList.remove('active-form');
      });
      forms[role].classList.add('active-form');
    });
  });
  // 默认显示学生表单
  document.querySelector('.role-btn[data-role="student"]').click();
</script>
</body>
</html>
