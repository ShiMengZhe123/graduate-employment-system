<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>招聘会申请</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success">
  <div class="container">
    <span class="navbar-brand">🎯 招聘会列表</span>
    <a href="/company/dashboard" class="btn btn-sm btn-light">返回控制台</a>
  </div>
</nav>
<div class="container mt-4">
  <div class="row">
    <div th:each="fair : ${jobFairs}" class="col-md-6 mb-3">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <strong th:text="${fair.title}"></strong>
        </div>
        <div class="card-body">
          <p>日期：<span th:text="${fair.date}"></span></p>
          <p>地点：<span th:text="${fair.location}"></span></p>
          <p th:text="${fair.description}"></p>
          <div th:if="${appliedIds.contains(fair.id)}">
            <span class="badge bg-secondary">已申请，等待审核</span>
          </div>
          <div th:unless="${appliedIds.contains(fair.id)}">
            <form method="post" th:action="@{/company/apply-jobfair/{id}(id=${fair.id})}">
              <button class="btn btn-outline-primary">申请参加</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div th:if="${#lists.isEmpty(jobFairs)}" class="alert alert-warning">暂无招聘会</div>
  </div>
</div>
</body>
</html>
