<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用人单位工作台 - 轻大就业服务</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .stat-card { border-left: 5px solid; transition: 0.2s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <span class="navbar-brand"><i class="fas fa-building"></i> <span th:text="${company.name}"></span> - 招聘管理后台</span>
        <div>
            <a href="/company/received-resumes" class="btn btn-sm btn-outline-light me-2">📬 收到的简历</a>
            <a href="/logout" class="btn btn-sm btn-light">退出登录</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <!-- 企业信息卡片 + 统计卡片 -->
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-white border-0 pt-3">
                    <h5><i class="fas fa-info-circle text-success"></i> 企业信息</h5>
                </div>
                <div class="card-body">
                    <p><strong>企业名称：</strong> <span th:text="${company.name}"></span></p>
                    <p><strong>信用代码：</strong> <span th:text="${company.creditCode}"></span></p>
                    <p><strong>联系人手机：</strong> <span th:text="${company.contactPhone}"></span></p>
                    <p><strong>地址：</strong> <span th:text="${company.address}"></span></p>
                    <button class="btn btn-outline-success btn-sm">编辑资料</button>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <div class="card stat-card border-0 shadow-sm" style="border-left-color: #198754;">
                        <div class="card-body">
                            <h6 class="text-muted">发布岗位数</h6>
                            <h2 class="mb-0" th:text="${#lists.size(myJobs)}">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card stat-card border-0 shadow-sm" style="border-left-color: #0dcaf0;">
                        <div class="card-body">
                            <h6 class="text-muted">累计简历接收</h6>
                            <h2 class="mb-0">23</h2>
                            <small>本周新增 5</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card stat-card border-0 shadow-sm" style="border-left-color: #ffc107;">
                        <div class="card-body">
                            <h6 class="text-muted">待处理面试</h6>
                            <h2 class="mb-0">3</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <!-- 左列：发布岗位 + 已有职位 -->
        <div class="col-md-5">
            <div class="card shadow mb-4">
                <div class="card-header bg-info text-white"><i class="fas fa-plus-circle"></i> 发布新岗位</div>
                <div class="card-body">
                    <form method="post" action="/company/add-job">
                        <div class="mb-2"><input type="text" name="jobTitle" class="form-control" placeholder="岗位名称" required></div>
                        <div class="mb-2"><input type="text" name="salary" class="form-control" placeholder="薪资范围，如 10k-15k" required></div>
                        <div class="mb-2"><input type="text" name="location" class="form-control" placeholder="工作地点" required></div>
                        <div class="mb-2"><textarea name="requirement" class="form-control" rows="2" placeholder="任职要求"></textarea></div>
                        <button class="btn btn-primary w-100">发布招聘</button>
                    </form>
                </div>
            </div>

            <div class="card shadow">
                <div class="card-header bg-warning">📋 我发布的职位</div>
                <div class="card-body" style="max-height: 350px; overflow-y: auto;">
                    <div th:if="${#lists.isEmpty(myJobs)}" class="text-muted">暂无职位，快发布一个吧～</div>
                    <ul class="list-group list-group-flush">
                        <li th:each="job, iterStat : ${myJobs}" class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong th:text="${job.jobTitle}"></strong><br>
                                <small class="text-secondary" th:text="${job.publishDate}"></small>
                            </div>
                            <form method="post" th:action="@{/company/delete-job/{index}(index=${iterStat.index})}" style="display:inline;">
                                <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash-alt"></i></button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 右列：人才搜索 + 校企合作板块 -->
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header bg-secondary text-white"><i class="fas fa-search"></i> 人才搜索（按专业）</div>
                <div class="card-body">
                    <form method="get" action="/company/search-student" class="row g-2 mb-3">
                        <div class="col-auto">
                            <select name="major" class="form-select">
                                <option value="">全部专业</option>
                                <option th:each="m : ${majors}" th:value="${m}" th:text="${m}"></option>
                            </select>
                        </div>
                        <div class="col-auto"><button class="btn btn-primary">搜索毕业生</button></div>
                    </form>
                    <div th:if="${students != null}">
                        <h6>搜索结果（<span th:text="${#lists.size(students)}"></span>人）</h6>
                        <ul class="list-group">
                            <li th:each="s : ${students}" class="list-group-item d-flex justify-content-between">
                                <span><i class="fas fa-user-graduate"></i> <span th:text="${s.name}"></span> - <span th:text="${s.major}"></span></span>
                                <span class="text-muted">📞 <span th:text="${s.phone}"></span></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 校企合作交流板块 -->
            <div class="card shadow mt-4">
                <div class="card-header bg-dark text-white"><i class="fas fa-handshake"></i> 校企合作交流</div>
                <div class="card-body">
                    <p>✔️ 已与郑州轻工业大学共建实习基地</p>
                    <p>✔️ 2026年春季校园宣讲会预约中 → <a href="#">点击申请</a></p>
                    <p>📅 下次校园双选会：2026年6月10日</p>
                    <button class="btn btn-sm btn-outline-primary">联系就业指导中心</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
